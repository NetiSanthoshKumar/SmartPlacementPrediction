<!DOCTYPE html>
<html>

<head>

    <title>Smart Placement Prediction</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container">

<h1>🎓 Smart Placement Prediction System</h1>

<p>Enter Student Details</p>

<form method="POST" action="/predict">

<div class="row">

<div class="field">
<label>Gender</label>
<select name="gender" required>
<option value="" disabled selected>Select gender</option>
<option value="Male">Male</option>
<option value="Female">Female</option>
</select>
</div>

<div class="field">
<label>Branch</label>
<select name="branch" required>
<option value="" disabled selected>Select branch</option>
<option value="CSE">CSE</option>
<option value="AIML">AIML</option>
<option value="DS">DS</option>
<option value="IT">IT</option>
<option value="ECE">ECE</option>
</select>
</div>

</div>

<div class="row">

<div class="field">
<label>CGPA (out of 10)</label>
<input type="number" step="0.01" name="cgpa" placeholder="e.g. 8.5" required>
</div>

<div class="field">
<label>Internships</label>
<input type="number" name="internships_count" placeholder="e.g. 2" required>
</div>

</div>

<div class="row">

<div class="field">
<label>Projects</label>
<input type="number" name="projects_count" placeholder="e.g. 3" required>
</div>

<div class="field">
<label>Attendance (%)</label>
<input type="number" name="attendance_percentage" placeholder="e.g. 85" required>
</div>

</div>

<div class="row">

<div class="field">
<label>Backlogs (count)</label>
<input type="number" name="backlogs" placeholder="e.g. 0" required>
</div>

</div>

<button type="submit">
Predict Placement
</button>

</form>

</div>

</body>

</html>
